# ### Hyprland ###
# Apps
$terminal = foot
$browser = zen-browser
$browser1 = google-chrome-stable
$editor = codium
$fileExplorer = dolphin --platformtheme kde
$btop = btop
$discord = vesktop
$cmus = foot cmus
$pavucontrol = pavucontrol

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 0.3
$workSpaceSwipeFingers = 4

# Blur
$blurEnabled = true
$blurSpecialWs = false
$blurPopups = true
$blurInputMethods = true
$blurSize = 8
$blurPasses = 2
$blurXray = false

# Shadow
$shadowEnabled = true
$shadowRange = 20
$shadowRenderPower = 3
$shadowColour = rgba($surfaced4)

# Gaps
$workspaceGaps = 20
$windowGapsIn = 10
$windowGapsOut = 40
$singleWindowGapsOut = 20

# Window styling
$windowOpacity = 0.95
$windowRounding = 10

$windowBorderSize = 3
$activeWindowBorderColour = rgba($primarye6)
$inactiveWindowBorderColour = rgba($onSurfaceVariant11)

# Misc
$volumeStep = 10  # In percent
$cursorTheme = sweet-cursors
$cursorSize = 24


# ### Keybinds ###
# Workspaces
$kbMoveWinToWs = Super+Shift
$kbMoveWinToWsGroup = Ctrl+Super+Alt
$kbGoToWs = Super
$kbGoToWsGroup = Ctrl+Super

$kbNextWs = Ctrl+Super, right
$kbPrevWs = Ctrl+Super, left

$kbToggleSpecialWs = Super, Tab
$kbMoveWinToSpecialWs = Super+Shift, Tab

# Window groups
$kbWindowGroupCycleNext = Super+Alt, Tab
$kbWindowGroupCyclePrev = Shift+Alt, Tab
$kbUngroup = Super, U
$kbToggleGroup = Super, Comma

# Window actions
$kbMoveWindow = Super, Y
$kbResizeWindow = Super, X
$kbWindowPip = Super+Alt, Backslash
$kbPinWindow = Super, P
$kbWindowFullscreen = Super, F
$kbWindowBorderedFullscreen = Super+Alt, F
$kbToggleWindowFloating = Super+Shift, F
$kbCloseWindow = Super, Q

# Special workspace toggles
$kbSystemMonitor = Ctrl, Escape
$kbMusic = Super, M
$kbStartMusic = Super+Alt, M
$kbGoToMusic = Super+Shift, M
$kbChat = Super, C
$kbStartChat = Super+Alt, C
$kbGoToChat = Super+Shift, C
$kbTodo = Super, R
$kbGoToTodo = Super+Shift, R
$kbStartTodo = Super+Alt, R

# Apps
$kbTerminal = Alt, Tab
$kbBrowser = Super, Space
$kbBrowser2 = Super_Shift, Space
$kbDiscord = Super, D
$kbCmus = Super, Z
$kbFileExplorer = Super, E
$kbPavucontrol = Super, A

# Misc
$kbSession = Super+Shift, Q
$kbClearNotifs = Ctrl+Alt, C
$kbShowPanels = Super, K
$kbLock = Super, L
$kbRestoreLock = Super+Alt, L
